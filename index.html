<script>
function showTab(id,el){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  document.querySelectorAll(".nav-center a").forEach(a=>a.classList.remove("active"));
  el.classList.add("active");
}
document.querySelectorAll("section")[0].style.display="block";

/* COUNTERS */
function bindCounter(name,id,max){
  const t=document.querySelector(`textarea[name="${name}"]`);
  const c=document.getElementById(id);
  if(!t||!c)return;
  const update = ()=> c.textContent = t.value.length + "/" + max;
  t.addEventListener("input", update);
  update();
}
bindCounter("Skusenosti","c1",1000);
bindCounter("Preco","c2",1000);

/* HELPERS */
function escapeHtml(v){
  const s = String(v ?? "");
  return s
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function getDiscordAvatar(req){
  const id = String(req.DiscordId || "").trim();
  if(!id) return "";
  const idx = Number(id.slice(-1)) % 5;
  return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
}
function pickAvatar(req){
  if(req && req.avatarUrl) return req.avatarUrl;
  if(req && req.defaultAvatarUrl) return req.defaultAvatarUrl;
  const local = getDiscordAvatar(req);
  if(local) return local;
  return "https://cdn.discordapp.com/embed/avatars/0.png";
}

/* AUTH STATE */
let AUTH = { loggedIn:false, isAdmin:false, user:null };

async function refreshAuthUI(){
  const login = document.getElementById("login");
  const panel = document.getElementById("panel");

  const wlLoginNotice = document.getElementById("wlLoginNotice");
  const wlMeNotice = document.getElementById("wlMeNotice");
  const wlForm = document.getElementById("wlForm");

  try{
    const r = await fetch("/auth/me", { credentials: "include" });
    const me = await r.json();
    AUTH = me || { loggedIn:false, isAdmin:false, user:null };

    // --- WL UI ---
    if(AUTH.loggedIn){
      wlLoginNotice.style.display = "none";
      wlMeNotice.style.display = "block";
      wlForm.style.display = "block";

      document.getElementById("wlMeName").textContent = AUTH.user?.username || "Prihlásený";
      document.getElementById("wlMeId").textContent = AUTH.user?.id ? `ID: ${AUTH.user.id}` : "";

      document.getElementById("wlDiscord").value =
        AUTH.user?.username && AUTH.user?.discriminator
          ? `${AUTH.user.username}#${AUTH.user.discriminator}`
          : "Discord pripojený";

      document.getElementById("wlDiscordId").value = AUTH.user?.id || "";

      const avatar = AUTH.user?.avatarUrl || AUTH.user?.defaultAvatarUrl || "https://cdn.discordapp.com/embed/avatars/0.png";
      document.getElementById("wlMeAvatar").src = avatar;
    } else {
      wlLoginNotice.style.display = "block";
      wlMeNotice.style.display = "none";
      wlForm.style.display = "none";
    }

    // --- ADMIN UI ---
    if(AUTH.loggedIn && AUTH.isAdmin){
      login.style.display = "none";
      panel.style.display = "block";

      document.getElementById("meName").textContent = AUTH.user?.username || "Admin";
      document.getElementById("meTag").textContent = AUTH.user?.id ? `ID: ${AUTH.user.id}` : "";

      const avatar = AUTH.user?.avatarUrl || AUTH.user?.defaultAvatarUrl || "https://cdn.discordapp.com/embed/avatars/0.png";
      document.getElementById("meAvatar").src = avatar;

      loadRequests();
    } else {
      panel.style.display = "none";
      login.style.display = "block";
    }

  } catch(e){
    wlLoginNotice.style.display = "block";
    wlMeNotice.style.display = "none";
    wlForm.style.display = "none";

    panel.style.display = "none";
    login.style.display = "block";
  }
}

function logoutAll(){
  window.location.href = "/auth/logout";
}

/* WL SEND */
document.getElementById("wlForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  if(!AUTH.loggedIn){
    alert("Najprv sa prihlás cez Discord.");
    return;
  }

  const btn = document.getElementById("wlSubmitBtn");
  btn.disabled = true;
  const oldTxt = btn.textContent;
  btn.textContent = "Odosielam...";

  const data = Object.fromEntries(new FormData(e.target));
  const payload = {
    Meno: data.Meno,
    Vek: data.Vek,
    Skusenosti: data.Skusenosti,
    Preco: data.Preco
  };

  try{
    const r = await fetch("/api/whitelist",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials: "include",
      body:JSON.stringify(payload)
    });
    const res = await r.json().catch(()=> ({}));

    if(r.ok && res.success){
      alert("Odoslané");
      e.target.reset();
      document.getElementById("c1").textContent = "0/1000";
      document.getElementById("c2").textContent = "0/1000";
    } else {
      alert("Chyba: " + (res.error || "Nepodarilo sa odoslať"));
    }
  } catch {
    alert("Chyba pripojenia na server");
  } finally {
    btn.disabled = false;
    btn.textContent = oldTxt;
  }
});

/* ADMIN LOAD */
function loadRequests(){
  fetch("/api/whitelist", { credentials: "include" })
    .then(r=>r.json())
    .then(data=>{
      const box=document.getElementById("requests");
      box.innerHTML="";

      if(!Array.isArray(data)){
        box.innerHTML = `<p style="color:#bbb;">${escapeHtml(data?.error || "Nemáš prístup")}</p>`;
        return;
      }

      if(data.length === 0){
        box.innerHTML = "<p style='color:#bbb;'>Žiadne žiadosti</p>";
        return;
      }

      data.forEach((req)=>{
        const card=document.createElement("div");
        card.className="wl-card";

        const avatar = pickAvatar(req);
        const reqId = String(req.id || "");

        card.innerHTML=`
          <div class="wl-header">
            <div class="wl-user">
              <img class="wl-avatar"
                   src="${escapeHtml(avatar)}"
                   alt="avatar"
                   onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
              <div>
                <div class="wl-name">${escapeHtml(req.Meno)}</div>
                <div class="wl-sub">Discord: ${escapeHtml(req.Discord || "-")}</div>
              </div>
            </div>
            <div class="status">${escapeHtml(req.status||"pending")}</div>
          </div>

          <div class="wl-body">
            <div class="qa-q">Věk:</div>
            <div class="qa-a">${escapeHtml(req.Vek)} let</div>

            <div class="qa-q">Discord ID:</div>
            <div class="qa-a">${escapeHtml(req.DiscordId || "-")}</div>

            <div class="qa-q">Zkušenosti s RP:</div>
            <div class="qa-a">${escapeHtml(req.Skusenosti)}</div>

            <div class="qa-q">Proč se chce připojit:</div>
            <div class="qa-a">${escapeHtml(req.Preco)}</div>
          </div>

          <div class="wl-actions">
            <button class="ok" onclick="action('${escapeHtml(reqId)}','approve')">Schváliť</button>
            <button class="no" onclick="action('${escapeHtml(reqId)}','reject')">Zamietnuť</button>
          </div>
        `;

        card.addEventListener("click",(e)=>{
          if(e.target.tagName.toLowerCase()==="button") return;
          card.classList.toggle("open");
        });

        box.appendChild(card);
      });
    })
    .catch(()=>alert("Nepodarilo sa načítať žiadosti"));
}

function action(id, act){
  if(!id){
    alert("Chyba: žiadosť nemá ID (skontroluj server ukladanie).");
    return;
  }

  fetch("/api/whitelist/action",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    credentials: "include",
    body:JSON.stringify({ id, action: act })
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.success) loadRequests();
    else alert(res.error || "Nemáš prístup (prihlás sa ako admin).");
  })
  .catch(()=>alert("Chyba pripojenia na server"));
}

document.addEventListener("DOMContentLoaded", async ()=>{
  await refreshAuthUI();

  const tab = new URLSearchParams(window.location.search).get("tab");
  if(tab){
    const link = [...document.querySelectorAll(".nav-center a")]
      .find(a => a.getAttribute("onclick")?.includes(tab));
    if(link) link.click();
  }
});
</script>
